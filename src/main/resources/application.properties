spring.application.name=api
 
# Base de datos (obligatorio definir en el entorno; sin valores por defecto)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
 
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
 
# Cloudinary
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.folder=${CLOUDINARY_FOLDER:ceramax}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
 
# Correo
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
 
# CORS (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://fsceramax.onrender.com,https://fcreramax.onrender.com}
 
app.checkout.simulado.enabled=${CHECKOUT_SIMULADO_ENABLED:true}
