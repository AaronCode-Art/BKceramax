spring.application.name=api
 

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS}
 
spring.jpa.hibernate.ddl-auto=none
reports.storage-dir=${REPORTS_STORAGE_DIR}
reports.jobs.retention=${REPORTS_RETENTION}
reports.jobs.cleanup-interval-ms=${REPORTS_CLEANUP_INTERVAL_MS}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Cache
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT}
spring.data.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.cloudinary.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cloudinary.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.cloudinary.sliding-window-size=10
resilience4j.circuitbreaker.instances.cloudinary.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.cloudinary.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.email.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.email.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.email.sliding-window-size=10
resilience4j.circuitbreaker.instances.email.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.email.permitted-number-of-calls-in-half-open-state=2

# Rate limiting (in-memory, per application instance)
app.rate-limit.auth.capacity=20
app.rate-limit.checkout.capacity=10
app.rate-limit.public.capacity=100
app.rate-limit.refill-period=1m
 
# Cloudinary
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.folder=${CLOUDINARY_FOLDER}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
 
# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
 
# CORS (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
 
app.checkout.simulado.enabled=${CHECKOUT_SIMULADO_ENABLED}

# Minimal, unauthenticated health endpoint; keep management endpoints otherwise private.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true